<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Quote Builder AI</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input{padding:.5rem;width:100px}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>🧾 Quote Builder AI</h1><p>Build a ballpark IT service quote instantly.</p><label>Devices: <input id="d" type="number" value="50"></label> <label>Hours labor: <input id="h" type="number" value="16"></label> <label>Parts ($): <input id="p" type="number" value="2000"></label> <button onclick="go()">Quote</button><div id="out"></div><script>function go(){const d=+document.getElementById('d').value,h=+document.getElementById('h').value,p=+document.getElementById('p').value;const sub=d*12+h*95+p,m=Math.round(sub*1.22);document.getElementById('out').textContent=`Device coverage: $${(d*12).toLocaleString()}\nLabor: $${(h*95).toLocaleString()}\nParts: $${p.toLocaleString()}\nSubtotal: $${sub.toLocaleString()}\nSuggested quote (22% margin): $${m.toLocaleString()}\n\nAutomated quoting integrated with your CRM: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/quote-builder-ai">GitHub</a> · <a href="https://ziontechgroup.com/zion-ai-rfp-builder/">RFP Builder</a></p></body></html>
